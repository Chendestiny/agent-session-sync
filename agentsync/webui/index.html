<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-session-sync · 会话同步 dashboard</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3c;
  --fg:#e6e6e6; --dim:#9aa3b5; --accent:#4f8cff; --err:#f87171; --ok:#34d399;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:16px}
.brand .tag{font-size:11px;font-weight:400;color:var(--dim);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}
nav{display:flex;gap:4px}
nav a{color:var(--dim);text-decoration:none;padding:5px 12px;border-radius:6px}
nav a.active{color:var(--fg);background:var(--panel2)}
nav a:hover{color:var(--fg)}
#refresh{margin-left:auto;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 14px;cursor:pointer}
#refresh:hover{border-color:var(--accent)}
main{padding:12px 14px;max-width:1280px;margin:0 auto}
h2{font-size:14px;color:var(--dim);font-weight:600;margin:10px 0 6px}
h2:first-child{margin-top:0}
.err{color:var(--err);white-space:pre-wrap}
.dim{color:var(--dim)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.card:hover{border-color:var(--accent)}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.4)}
.card .src{display:flex;align-items:center;gap:6px;font-weight:700;flex-wrap:wrap}
.card .src .sw{width:10px;height:10px;border-radius:3px;flex:none}
.card .path{font-size:10px;color:var(--dim);margin-top:2px;display:flex;gap:6px;align-items:center}
.card .path .pt{flex:1;min-width:0;word-break:break-all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stat{font-size:12px;color:var(--dim);margin-top:3px}
.card .tags{display:flex;gap:4px;margin-left:auto;flex:none;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 5px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
.tag.e{border-color:#3b82f6;color:#3b82f6;cursor:pointer;transition:background .12s,color .12s}
.tag.e:hover{background:#3b82f6;color:#0f1115}
.tag.k{border-color:#8b5cf6;color:#8b5cf6;cursor:pointer;transition:background .12s,color .12s}
.tag.k:hover{background:#8b5cf6;color:#0f1115}
.tag.w{border-color:#10b981;color:#10b981;cursor:pointer;transition:background .12s,color .12s}
.tag.w:hover{background:#10b981;color:#0f1115}
.tag.r{border-color:#6b7280;color:#9ca3af;cursor:default}
.tag.b{border-color:var(--dim);color:var(--dim);cursor:pointer;transition:background .12s,color .12s}
.tag.b:hover{background:var(--dim);color:#0f1115}
.bindlnk{color:var(--err);cursor:pointer;text-decoration:underline dotted}
.bl{color:var(--accent);font-size:10px}
a.xbtn{font-size:11px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:3px}
a.xbtn:hover{border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:680px;width:92%;padding:16px 18px;max-height:82vh;overflow:auto}
.modal label{display:inline-block;margin:2px 10px 2px 0;font-size:13px;cursor:pointer}
.modal .kv{margin:10px 0 2px}
.mbtn{background:var(--accent);border:none;color:#fff;border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;margin-right:8px}
.mbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.modal pre{white-space:pre-wrap;margin:0}
/* 导出弹窗：会话列表框 + 滚动条 */
.chipbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:12px;
  padding:2px 10px;font-size:12px;cursor:pointer;margin-right:6px}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.xlist{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px}
.xitem{display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0;cursor:pointer}
.xitem .xt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xitem .xd{color:var(--dim);font-size:11px;flex:none}
.xlist::-webkit-scrollbar,.modal .box::-webkit-scrollbar{width:8px}
.xlist::-webkit-scrollbar-track,.modal .box::-webkit-scrollbar-track{background:transparent}
.xlist::-webkit-scrollbar-thumb,.modal .box::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.xlist::-webkit-scrollbar-thumb:hover,.modal .box::-webkit-scrollbar-thumb:hover{background:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--err)}
.kv{font-size:12px;color:var(--dim);margin-top:4px}
.kv b{color:var(--fg);font-weight:600}
/* 时间轴 */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow:hidden}
.tl-axis{position:relative;height:18px;margin-left:84px;color:var(--dim);font-size:10px}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lane{display:flex;align-items:center;height:22px}
.lane .lb{width:76px;flex:none;font-size:11px;color:var(--dim);text-align:right;padding-right:8px}
.lane .track{position:relative;flex:1;height:16px;background:var(--panel2);
  border-radius:4px;overflow:hidden}
.bar{position:absolute;top:4px;height:14px;border-radius:2px;min-width:3px;opacity:.85;cursor:pointer}
.bar:hover{opacity:1;outline:1px solid #fff3}
/* 筛选 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 12px;cursor:pointer;
  color:var(--dim);background:var(--panel);font-size:12px;user-select:none}
.chip.on{color:var(--fg);border-color:currentColor}
.filters input[type=date],.filters input[type=text]{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:4px 8px}
.filters input[type=text]{width:200px}
/* 表格 */
table{border-collapse:collapse;width:100%;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--dim);font-weight:600;background:var(--panel2);position:sticky;top:0}
tr.row{cursor:pointer} tr.row:hover{background:var(--panel2)}
tr.row.trashed{opacity:.45}
tr.row.trashed td:nth-child(2){text-decoration:line-through;text-decoration-color:#6b7280}
tr.row.subrow{opacity:.55}
tr.row.subrow td:nth-child(2){color:var(--dim)}
tr.row.improw td:nth-child(2){color:#f59e0b}
.badge{display:inline-block;border-radius:4px;padding:0 8px;font-size:11px;
  color:#0f1115;font-weight:700;white-space:nowrap}
/* 详情 */
.hd{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.hd .t{font-size:16px;font-weight:700;margin:6px 0 2px}
.turn{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;margin-top:6px;cursor:pointer}
.turn:hover{border-color:var(--accent)}
.turn .meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.turn .idx{color:var(--dim);font-size:12px}
.turn .tm{color:var(--accent);font-size:12px}
.turn .pv{margin-top:2px;color:var(--fg)}
.turn .steps{margin-top:8px;cursor:default}
.blk{background:var(--panel2);border-radius:6px;padding:6px 10px;margin-top:6px;font-size:13px}
.blk.reasoning{color:var(--dim);font-style:italic}
.blk pre{margin:0;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.tc{color:#ffd479} .tr{color:var(--dim)} .err-block{color:var(--err)}
svg .tick{stroke:var(--line)} svg text{fill:var(--dim);font-size:10px}
.hint{color:var(--dim);font-size:12px}
.back{color:var(--accent);text-decoration:none;display:inline-block;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="brand">agent-session-sync</div>
  <nav>
    <a href="#/" data-view="overview">总览</a>
    <a href="#/sessions" data-view="sessions">会话列表</a>
  </nav>
  <button id="refresh" title="丢弃缓存重新加载">刷新</button>
</header>
<main id="app"></main>
<script>
"use strict";
const SOURCES = ["zcode","hermes","dsh","codex","workbuddy","claude","opencode","qoder","openclaw","cursor","trae"];
const COLORS = {zcode:"#84cc16",hermes:"#eab308",dsh:"#4f8cff",codex:"#a78bfa",
                workbuddy:"#f472b6",claude:"#f97316",opencode:"#22d3ee",qoder:"#14b8a6",openclaw:"#ef4444",
                cursor:"#6366f1",trae:"#0ea5e9"};
const SRC_CN  = {zcode:"ZCode",hermes:"Hermes",dsh:"DSH",codex:"Codex",
                 workbuddy:"WorkBuddy",claude:"Claude Code",opencode:"OpenCode",qoder:"Qoder",openclaw:"OpenClaw",
                 cursor:"Cursor",trae:"Trae"};
const WRITABLE = new Set(["dsh","codex","claude","hermes","opencode","workbuddy"]); // 6 写入目标；zcode/qoder/openclaw 只读
let metasCache = {};          // source -> metas[]
const app = document.getElementById("app");

/* ── 工具 ─────────────────────────────────────────── */
async function jget(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text().catch(()=>"")).slice(0,200));
  return r.json();
}
/* 会话列表缓存：内存 + sessionStorage（点刷新才重新加载；F5 也不丢） */
function cacheGet(src){
  if(metasCache[src] !== undefined) return Promise.resolve(metasCache[src]);
  try{
    const raw = sessionStorage.getItem("ass-metas-"+src);
    if(raw){ metasCache[src] = JSON.parse(raw); return Promise.resolve(metasCache[src]); }
  }catch(e){}
  return jget("/api/sessions?source="+encodeURIComponent(src)).then(ms => {
    metasCache[src] = ms;
    try{ sessionStorage.setItem("ass-metas-"+src, JSON.stringify(ms)); }catch(e){}
    return ms;
  });
}
function cachePurge(){
  metasCache = {};
  try{
    Object.keys(sessionStorage).filter(k => k.startsWith("ass-metas-"))
      .forEach(k => sessionStorage.removeItem(k));
  }catch(e){}
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const p2 = n => String(n).padStart(2,"0");
function fmt(ms){
  if(!ms) return "-";
  const d = new Date(ms);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());
}
function fmtShort(ms){
  if(!ms) return "-";
  const d = new Date(ms);
  return p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());
}
function errBox(msg){ return '<div class="err">加载失败：'+esc(msg)+"</div>"; }
function badge(src){ return '<span class="badge" style="background:'+COLORS[src]+'">'+esc(SRC_CN[src]||src)+"</span>"; }

/* ── 视图：总览 ───────────────────────────────────── */
/* ── 弹窗：整源导出 / 写入提示词 ────────────────────── */
function closeModal(){ const m = document.getElementById("modalOv"); if(m) m.remove(); }
function openModal(html){
  closeModal();
  const ov = document.createElement("div");
  ov.className = "modal"; ov.id = "modalOv";
  ov.innerHTML = '<div class="box">'+html+'</div>';
  ov.addEventListener("click", e => { if(e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function copyText(t, btn){
  const done = ok => { if(btn){ const old = btn.textContent; btn.textContent = ok ? "已复制 ✓" : "复制失败";
    setTimeout(() => { btn.textContent = old; }, 1500); } };
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
    ta.remove(); done(ok);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => done(true), fallback);
  } else fallback();
}
async function openExportModal(src){
  let ms = [];
  try{ ms = await cacheGet(src); }catch(e){}
  ms = ms.filter(m => !m.subagent && !m.trashed && !m.imported)   // 口径=原生
         .sort((a,b) => b.updated_at - a.updated_at);
  openModal(
    '<h3 style="margin:0 0 10px">导出 ' + esc(SRC_CN[src]||src) + ' 会话</h3>'
    + '<div class="kv">格式：</div>'
    + '<label><input type="radio" name="xfmt" value="md" checked> Markdown（人读 · 合并单文件）</label>'
    + '<label><input type="radio" name="xfmt" value="jsonl"> IR JSONL（机读 · 一行一会话 · 与 C 库同构，可 push 回写）</label>'
    + '<div class="kv" style="margin-top:10px">会话（可手动勾选）：<span class="chipbtn on" data-days="0">全部</span>'
    + '<span class="chipbtn" data-days="7">最近 7 天</span><span class="chipbtn" data-days="30">最近 30 天</span>'
    + ' <span id="xcount" style="color:var(--dim);font-size:12px"></span></div>'
    + '<div class="xlist" id="xlist">' + (ms.length
        ? ms.map(m => '<label class="xitem"><input type="checkbox" checked value="'+esc(m.id)+'">'
            + '<span class="xt" title="'+esc(m.title||m.id)+'">'+esc((m.title||"(无标题)").slice(0,60))+'</span>'
            + '<span class="xd">'+esc(fmtShort(m.updated_at))+'</span></label>').join("")
        : '<div class="hint">该源无可导出的原生会话</div>') + '</div>'
    + '<div class="hint" style="margin:8px 0">口径 = 原生会话：排除 🤖子代理、🗑回收站、📥导入副本（正主在各自原生源）。</div>'
    + '<button class="mbtn" id="xgo">⬇ 下载</button><button class="mbtn ghost" id="xclose">关闭</button>'
  );
  const list = document.getElementById("xlist");
  const count = () => {
    const n = list.querySelectorAll("input:checked").length;
    document.getElementById("xcount").textContent = "已选 " + n + " / " + ms.length;
    return n;
  };
  count();
  list.addEventListener("change", () => { count();
    document.querySelectorAll(".chipbtn").forEach(c => c.classList.remove("on")); });  // 手动改选后快选不再高亮
  document.querySelectorAll(".chipbtn").forEach(c => c.onclick = () => {
    document.querySelectorAll(".chipbtn").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    const d = Number(c.dataset.days);
    const floor = d ? Date.now() - d*864e5 : 0;
    list.querySelectorAll("input[type=checkbox]").forEach(cb => {
      const m = ms.find(x => x.id === cb.value);
      cb.checked = !!m && (!floor || m.updated_at >= floor);
    });
    count();
  });
  document.getElementById("xgo").onclick = () => {
    const fmt = document.querySelector('input[name="xfmt"]:checked').value;
    const ids = Array.from(list.querySelectorAll("input:checked")).map(cb => cb.value);
    if(!ids.length){ alert("请至少勾选一条会话"); return; }
    location.href = "/api/export-source?source=" + encodeURIComponent(src) + "&fmt=" + fmt
                  + "&ids=" + encodeURIComponent(ids.join(","));
    closeModal();
  };
  document.getElementById("xclose").onclick = closeModal;
}
function writePrompt(src){
  const head = "使用 session-sync skill（~/.agents/skills/session-sync/，一句话触发，手册在里面）：";
  if(src === "dsh"){
    return [
      head + "把其他 agent 的最新会话同步进 dsh，并完成挂载分组。",
      "要求：",
      "1. 先 selftest 自检，必须全绿再动真实数据；",
      "2. dry-run 看写入计划，确认后再落盘（增量 + 预算控制，防超上下文）；",
      "3. 写入后完全退出 dsh 再挂载（attach），否则会话堆在「未分组」；",
      "4. 如实报告：写了多少、跳过多少、有无裁剪。"
    ].join("\n");
  }
  const needExit = ["hermes","opencode","workbuddy"].includes(src) ? "；目标应用需先完全退出再写入" : "";
  return [
    head + "把其他 agent 的最新会话同步进 " + (SRC_CN[src]||src) + needExit + "。",
    "要求：",
    "1. 先 selftest 自检，必须全绿再动真实数据；",
    "2. dry-run 看写入计划，确认后再落盘（增量 scope=inc）；",
    "3. 如实报告：写了多少、跳过多少。"
    ].join("\n");
}
function openWriteModal(src){
  const p = writePrompt(src);
  openModal(
    '<h3 style="margin:0 0 10px">写入 ' + esc(SRC_CN[src]||src) + '：把提示词交给 agent 代跑</h3>'
    + '<div style="display:flex;gap:10px;align-items:flex-start">'
    + '<pre style="flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px">' + esc(p) + '</pre>'
    + '<button class="mbtn" id="wcopy" style="flex:none">复制</button></div>'
    + '<div class="hint" style="margin:8px 0">复制后粘给任意 AI agent（zcode / codex / dsh…）即可代执行；写入命令默认 dry-run，agent 会先看计划再加 --apply。</div>'
  );
  document.getElementById("wcopy").onclick = function(){ copyText(p, this); };
}
async function openBackupModal(src){
  let ms = [];
  try{ ms = await cacheGet(src); }catch(e){}
  const nat = ms.filter(m => !m.subagent && !m.trashed && !m.imported).length;
  openModal(
    '<h3 style="margin:0 0 10px">备份 ' + esc(SRC_CN[src]||src) + '（快照到 C 库 backups/）</h3>'
    + '<div class="kv">口径：<span class="chipbtn on" data-imp="0">原生（' + nat + '）</span>'
    + '<span class="chipbtn" data-imp="1">原生+导入（' + ms.filter(m => !m.subagent && !m.trashed).length + '）</span>'
    + ' · 范围：<span class="chipbtn on bd" data-days="0">全部</span>'
    + '<span class="chipbtn bd" data-days="7">最近 7 天</span><span class="chipbtn bd" data-days="30">最近 30 天</span></div>'
    + '<button class="mbtn" id="bgo">📦 立即备份</button>'
    + '<div class="hint" style="margin:8px 0">快照=会话 IR（与 C 库同构）落到 ~/.session-sync/backups/，不碰源数据、不推进增量水位；还原走幂等写入，已存在自动跳过。</div>'
    + '<div class="kv" style="margin-top:6px">已有快照：</div><div class="xlist" id="blist">加载中…</div>'
    + '<button class="mbtn ghost" id="bclose" style="margin-top:8px">关闭</button>'
  );
  let withImports = 0, days = 0;
  document.querySelectorAll(".chipbtn[data-imp]").forEach(c => c.onclick = () => {
    document.querySelectorAll(".chipbtn[data-imp]").forEach(x => x.classList.remove("on"));
    c.classList.add("on"); withImports = Number(c.dataset.imp);
  });
  document.querySelectorAll(".chipbtn.bd").forEach(c => c.onclick = () => {
    document.querySelectorAll(".chipbtn.bd").forEach(x => x.classList.remove("on"));
    c.classList.add("on"); days = Number(c.dataset.days);
  });
  const loadList = async () => {
    let rows = [];
    try{ rows = await (await fetch("/api/backups?source=" + encodeURIComponent(src))).json(); }catch(e){}
    document.getElementById("blist").innerHTML = rows.length
      ? rows.map(r => '<label class="xitem"><span class="xt">' + esc(r.ts)
          + ' · ' + r.count + ' 条 · ' + r.size_kb + ' KB · ' + (r.with_imports ? "原生+导入" : "原生")
          + ' · ' + (r.days ? r.days + "天" : "全部") + '</span>'
          + '<button class="mbtn ghost brst" data-ts="'+esc(r.ts)+'" style="flex:none;padding:2px 10px;font-size:12px">还原</button></label>').join("")
      : '<div class="hint">（暂无快照）</div>';
    document.querySelectorAll(".brst").forEach(b => b.onclick = async () => {
      const tgt = WRITABLE.has(src) ? src : (src === "zcode" ? "dsh" : "dsh");
      if(!confirm("还原 " + (SRC_CN[src]||src) + "@" + b.dataset.ts + " → " + (SRC_CN[tgt]||tgt)

function openBindModal(src){
  const inp = 'style="flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px 8px;font-size:13px"';
  openModal(
    '<h3 style="margin:0 0 10px">绑定 ' + esc(SRC_CN[src]||src) + ' 数据目录</h3>'
    + '<div class="hint">粘贴该源存储的绝对路径——应用根目录或 sessions / state.db 等直接目标均可，后端自动识别结构并校验。<br>'
    + '注：浏览器安全策略不允许网页读取所选文件夹的绝对路径，「选文件夹」只用于预填文件夹名，仍需补全。</div>'
    + '<div style="display:flex;gap:8px;margin:8px 0">'
    + '<input id="bpath" type="text" ' + inp + ' placeholder="例如 C:\\Users\\me\\.' + (src==='zcode'?'zcode':src) + '">'
    + '<button class="mbtn ghost" id="bnative" style="margin:0;flex:none" title="本地服务弹系统对话框，直接拿绝对路径">原生选择…</button>'
    + '<label class="mbtn ghost" style="margin:0;flex:none" title="浏览器安全策略拿不到绝对路径，只做预填">网页选文件夹<input type="file" webkitdirectory id="bpick" style="display:none"></label></div>'
    + '<div id="bmsg" class="hint" style="min-height:18px"></div>'
    + '<button class="mbtn" id="bgo">校验并保存</button>'
    + '<button class="mbtn ghost" id="bunbind">解绑（恢复自动探测）</button>'
    + '<button class="mbtn ghost" id="bclose">关闭</button>'
  );
  const msg = document.getElementById("bmsg");
  const pathEl = document.getElementById("bpath");
  document.getElementById("bpick").onchange = ev => {
    const fs = ev.target.files;
    if(!fs || !fs.length) return;
    const f = fs[0];
    let guess = (f.path && String(f.path)) || "";   // 非标准属性：Electron/旧内核才有
    if(!guess){
      const root = (f.webkitRelativePath || "").split("/")[0];
      guess = root ? "~/" + root : "";
    }
    if(guess) pathEl.value = guess;
    msg.textContent = guess.startsWith("~") ? "已预填文件夹名（" + guess + "）——请补全为绝对路径后保存"
                                            : "已带入所选路径，确认无误后保存";
  };
  document.getElementById("bnative").onclick = async () => {
    msg.textContent = "等待系统对话框…（取消则无操作）";
    try{
      const r = await fetch("/api/pick-folder", {method: "POST"});
      const d = await r.json();
      if(d.ok && d.path){
        pathEl.value = d.path;
        msg.textContent = "已选：" + d.path + "（自动校验保存中…）";
        post(d.path);   // 选完直接绑定
      } else {
        msg.textContent = d.ok ? "已取消选择" : ("原生对话框不可用：" + (d.error || "") + "——请改用粘贴路径");
      }
    }catch(e){ msg.textContent = "请求失败：" + e.message; }
  };
  const post = async path => {
    try{
      const r = await fetch("/api/bind-path", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({source: src, path: path})});
      const d = await r.json();
      msg.textContent = d.detail || (d.ok ? "OK" : "失败");
      if(d.ok) setTimeout(() => { closeModal(); cachePurge(); route(); }, 700);
    }catch(e){ msg.textContent = "请求失败：" + e.message; }
  };
  document.getElementById("bgo").onclick = () => { msg.textContent = "校验中…"; post(pathEl.value.trim()); };
  document.getElementById("bunbind").onclick = () => post("");
  document.getElementById("bclose").onclick = closeModal;
}

function renderTimeline(all){
  const tl = document.getElementById("tl");
  const entries = Object.values(all).flat();
  if(!entries.length){ tl.innerHTML = '<div class="hint">暂无会话数据</div>'; return; }
  const t0 = Math.min(...entries.map(m => m.span_first||m.created_at||Infinity).filter(Number.isFinite));
  const t1raw = Math.max(...entries.map(m => Math.max(m.span_last||0, m.updated_at||0)));
  let t1 = t1raw;
  if(!t0 || !t1 || t1 - t0 < 3600e3){ const now = Date.now(); t1 = Math.max(t1, now); }  // 退化为「截至现在」
  const dom = Math.max(t1 - t0, 1);
  const x = ms => ((ms - t0) / dom * 100).toFixed(3);

  let html = '<div class="tl-axis">';
  for(let i = 0; i <= 4; i++){
    const ms = t0 + dom * i / 4;
    html += '<span style="left:'+(i*25)+'%">' + fmtShort(ms) + "</span>";
  }
  html += "</div>";
  for(const src of SOURCES){
    const ms = (all[src]||[]).slice().sort((a,b)=>a.span_first-b.span_first);
    let bars = "";
    for(const m of ms){
      const l = x(m.span_first||m.created_at||t0);
      const w = Math.max((Math.max(m.span_last||0, m.updated_at||0) - (m.span_first||m.created_at||t0)) / dom * 100, .4);
      const tip = (SRC_CN[src]||src)+" · "+(m.title||m.id)+(m.trashed?" · 🗑回收站":"")+(m.subagent?" · 🤖子代理":"")+"\n"+fmt(m.span_first||m.created_at)+" ~ "+fmt(Math.max(m.span_last||0,m.updated_at||0))+" · "+m.turns+" 轮";
      bars += '<div class="bar" style="left:'+l+'%;width:'+w+'%;background:'+(m.trashed?"#4b5563":COLORS[src])+';opacity:'+(m.subagent?".35":".85")+'" title="'+esc(tip)+'" data-href="#/session/'+src+"/"+encodeURIComponent(m.id)+'"></div>';
    }
    const shown = (all[src]||[]).filter(m => !m.subagent).length;  // 泳道计数与源卡同口径（不含🤖子代理）
    html += '<div class="lane"><div class="lb">'+esc(SRC_CN[src]||src)+" "+shown+'</div><div class="track">'+bars+"</div></div>";
  }
  tl.innerHTML = html;
  tl.querySelectorAll(".bar").forEach(b => b.onclick = () => { location.hash = b.dataset.href; });
}

const expanded = new Set();
async function renderDetail(src, id){
  expanded.clear();

    d = await jget("/api/session?source="+encodeURIComponent(src)+"&id="+encodeURIComponent(id));
  }catch(e){ box.innerHTML = errBox(e.message); return; }
  const times = (d.turns||[]).map(t => t.time||0).filter(Boolean);
  const tmin = times.length ? Math.min(...times) : 0;
  const tmax = times.length ? Math.max(...times) : 0;
  const xu = "/api/export?source="+encodeURIComponent(src)+"&id="+encodeURIComponent(id)+"&fmt=";
  let html = '<div class="hd">'+badge(d.source)
    + (d.subagent?' <span class="badge" style="background:#8b5cf6" title="origin=subagent 委派会话（默认不同步）">🤖 子代理</span>':"")
    + (d.imported?' <span class="badge" style="background:#f59e0b" title="agentsync 导入（其他 agent 会话副本，同步默认排除）">📥 导入</span>':"")
    + '<div class="t"'+(d.imported?' style="color:#f59e0b" title="📥 agentsync 导入会话"':"")+'>'+esc(d.title||"(无标题)")+"</div>"
    + '<div class="kv">cwd：<b>'+esc(d.cwd||"-")+'</b></div>'
    + '<div class="kv">跨度：<b>'+fmt(d.created_at)+" ~ "+fmt(d.updated_at||tmax)+'</b>'
    + " · <b>"+(d.turns||[]).length+"</b> 轮</div>"
    + '<div class="kv mono">id：'+esc(d.source_id)+'</div>'
    + (d.source_path?'<div class="kv mono">源文件：'+esc(d.source_path)+"</div>":"")
    + '<div class="kv">导出：<a class="xbtn" style="padding:1px 8px" href="'+xu+'md">⬇ Markdown（人读）</a><a class="xbtn" style="padding:1px 8px" href="'+xu+'ir">⬇ IR JSON（C 库同构，可 push 回写）</a></div>'
    + "</div>";

  /* 轮次时间条：压平 bug 一眼可见 */
  html += '<h2>轮次时间分布</h2><div class="tl">';
  if(!times.length){
    html += '<div class="hint">该会话无轮次时间（旧数据，Turn.time 修复前导入）</div>';
  }else{
    let a = tmin, b = Math.max(tmax, tmin + 3600e3);
    const W = 1000, dom = b - a;
    let svg = '<svg viewBox="0 0 '+W+' 64" style="width:100%;height:64px" preserveAspectRatio="none">';
    for(let i = 0; i <= 4; i++){
      const xx = W * i / 4;
      svg += '<line class="tick" x1="'+xx+'" y1="50" x2="'+xx+'" y2="58"/>'
           + '<text x="'+xx+'" y="63" text-anchor="middle">'+fmtShort(a + dom*i/4)+"</text>";
    }
    (d.turns||[]).forEach((t, i) => {
      if(!t.time) return;
      const xx = ((t.time - a) / dom * W).toFixed(1);
      svg += '<line x1="'+xx+'" y1="6" x2="'+xx+'" y2="46" stroke="'+COLORS[d.source]
           + '" stroke-width="2"><title>#'+(i+1)+" "+fmt(t.time)+"</title></line>";
    });
    svg += "</svg>";
    html += svg;
  }
  html += "</div>";

  /* 轮次列表 */
  html += '<h2>轮次（点击展开步骤）</h2>';
  (d.turns||[]).forEach((t, i) => {
    const tools = (t.steps||[]).reduce((n,s)=>n+(s.tool_calls||[]).length,0);
    const msgs = 1 + (t.steps||[]).length + (t.steps||[]).reduce((n,s)=>n+(s.tool_results||[]).length,0);
    html += '<div class="turn" data-i="'+i+'"><div class="meta">'
      + '<span class="idx">#'+(i+1)+"</span>"
      + '<span class="tm">'+fmt(t.time)+'</span>'
      + '<span class="dim">'+msgs+' 消息 · '+tools+' 工具</span></div>'
      + '<div class="pv">'+esc((t.prompt||"").slice(0,200))+((t.prompt||"").length>200?"…":"")+"</div>"
      + '<div class="steps" style="display:'+(expanded.has(i)?"block":"none")+'">'+stepsHtml(t)+"</div></div>";
  });
  if(!(d.turns||[]).length) html += '<div class="hint">（无轮次）</div>';
  box.innerHTML = html;
  box.querySelectorAll(".turn").forEach(el => el.onclick = () => {
    const i = +el.dataset.i;
    expanded.has(i) ? expanded.delete(i) : expanded.add(i);
    el.querySelector(".steps").style.display = expanded.has(i) ? "block" : "none";
  });
}
function stepsHtml(t){
  let html = "";
  (t.steps||[]).forEach((s, si) => {
    (s.content||[]).forEach(b => {
      if(b.type === "text") html += '<div class="blk"><pre>'+esc(b.text||"")+"</pre></div>";
      else if(b.type === "reasoning") html += '<div class="blk reasoning"><pre>'+esc(b.text||"")+"</pre></div>";
      else if(b.type === "tool-call") html += '<div class="blk tc">🔧 '+esc(b.name)+" <pre>"+esc(b.arguments||"")+"</pre></div>";
    });
    (s.tool_calls||[]).forEach(c => {
      html += '<div class="blk tc">▶ '+esc(c.name)+" <pre>"+esc(c.arguments||"")+"</pre></div>";
    });
    (s.tool_results||[]).forEach(r => {
      const text = (r.content||[]).filter(x=>x.type==="text").map(x=>x.text||"").join("\n").slice(0,2000);
      html += '<div class="blk tr'+(r.is_error?" err-block":"")+'">⬅ '+(r.is_error?"(错误) ":"结果 ")
            + "<pre>"+esc(text)+((r.content||[]).some(x=>(x.text||"").length>2000)?"…":"")+"</pre></div>";
    });
  });
  return html || '<div class="hint">（空步骤）</div>';
}

/* ── 路由 ─────────────────────────────────────────── */
function route(){
  const h = location.hash || "#/";
  const view = h.startsWith("#/session/") ? "sessions" : (h === "#/sessions" ? "sessions" : "overview");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.view === view));
  const parts = h.slice(2).split("/").map(decodeURIComponent);
  if(parts[0] === "session" && parts[1] && parts[2]) renderDetail(parts[1], parts[2]);
  else if(parts[0] === "sessions") renderSessions();
  else renderOverview();
}
document.getElementById("refresh").onclick = () => { cachePurge(); route(); };
window.addEventListener("hashchange", route);
route();
</script>
