<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-session-sync · 会话同步 dashboard</title>
<script>/* 主题防闪烁：首帧前恢复上次选择（与 app/theme.js 同 key） */
try{var _t=localStorage.getItem("ass-theme");if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<link rel="stylesheet" href="/app/style.css">
</head>
<body>
<header>
  <div class="brand">agent-session-sync</div>
  <nav>
    <a href="#/" data-view="overview" data-i18n="nav.overview">总览</a>
    <a href="#/sessions" data-view="sessions" data-i18n="nav.sessions">会话列表</a>
  </nav>
  <div id="themeWrap">
    <button id="themeBtn" data-i18n-title="theme.title" data-i18n-aria="theme.title" aria-label="切换配色" aria-haspopup="menu">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
      </svg>
    </button>
    <div id="themeMenu" hidden>
      <button class="themeItem" data-value="indigo">
        <span class="swatch"><i style="background:#6366f1"></i><i style="background:#818cf8"></i></span>
        <span class="tname" data-i18n="theme.indigo">深空蓝紫</span><span class="tcheck">✓</span>
      </button>
      <button class="themeItem" data-value="olive">
        <span class="swatch"><i style="background:#a3e635"></i><i style="background:#84cc16"></i></span>
        <span class="tname" data-i18n="theme.olive">冷灰橄榄</span><span class="tcheck">✓</span>
      </button>
      <button class="themeItem" data-value="sand">
        <span class="swatch"><i style="background:#c2410c"></i><i style="background:#f5f0eb"></i></span>
        <span class="tname" data-i18n="theme.sand">浅色暖沙</span><span class="tcheck">✓</span>
      </button>
    </div>
  </div>
  <button id="lang" data-i18n-title="lang.title">EN</button>
  <button id="refresh" data-i18n-title="refresh.title" data-i18n-aria="refresh" aria-label="刷新">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
    </svg>
  </button>
</header>
<main id="app"></main>
<!-- 原生 ES modules，无构建：入口 main.js（模块延迟执行，等价于原底部 <script> 时机）。
     静态文案带 data-i18n*，applyStatic() 启动/切语言时统一翻译；视图文案在模板 t() 里。 -->
<script type="module" src="/app/main.js"></script>
</body>
</html>
